name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p ezspec-core

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.backend }} backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        backend: [rust, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install (builds the Rust extension via maturin)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,test]" ruff
      - name: Lint
        run: ruff check python tests
      - name: Tests (NIST StRD, pybaselines parity, statistics, I/O, export, GUI)
        env:
          QT_QPA_PLATFORM: offscreen
          EZSPEC_BACKEND: ${{ matrix.backend }}
        run: pytest -q

  wheels:
    name: abi3 wheels (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist
