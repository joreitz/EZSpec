[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ezspec"
version = "0.1.0"
description = "Interactive spectrum processing and curve fitting with honest fit statistics (Rust core, Python statistics, Qt GUI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "lmfit>=1.3",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13.7"]
mcmc = ["emcee>=3.1"]
test = ["pytest>=8", "pybaselines>=1.2", "emcee>=3.1"]

[project.scripts]
ezspec = "ezspec.gui.app:main"

[tool.maturin]
manifest-path = "crates/ezspec-py/Cargo.toml"
python-source = "python"
module-name = "ezspec._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pyqtgraph.*"]
markers = ["slow: statistical Monte-Carlo tests (deselect with -m 'not slow')"]
