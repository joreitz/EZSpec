[package]
name = "ezspec-py"
description = "PyO3 bindings for ezspec-core (Python module ezspec._core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
ezspec-core = { path = "../ezspec-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
